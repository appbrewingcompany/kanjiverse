name: Auto Assign PR Reviewer
on:
  pull_request:
    types: [opened, ready_for_review]
jobs:
  call-auto-assign:
    uses: appbrewingcompany/.github/.github/workflows/auto-assign-reviewer.yml@main
    with:
      runner: ubuntu-latest  # public repo — org self-hosted runners cannot serve it
    permissions:
      pull-requests: write
      issues: write
      contents: read
